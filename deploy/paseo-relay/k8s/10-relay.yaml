# Paseo Relay：Elixir/OTP 写的 WebSocket 中继（上游 getpaseo/paseo-relay）——**单实例**部署。
#
# ── 这个部署的形态（下面这套就是实测过的那套）────────────────────────
#   · **单实例**：`replicas: 1`，并且**关掉 Erlang 分布**（RELEASE_DISTRIBUTION=none）——
#     不起 epmd、不监听 4369、不解析任何集群 DNS；
#   · **无任何持久化**：没有库 / Redis / 卷，状态在节点内存里，重启即丢（客户端重连即可）；
#   · 因此只有两个对象：Deployment + Service，**不需要 Secret**。
#   实测（本机容器，环境变量与本清单一致）：/ready 返回 200、/metrics 里 paseo_relay_ready 1、
#   日志 0 条报错、4369 无监听。
#
# ⚠️ **别只把 replicas 改大**：中继的「归属」是每节点内存态 —— 多副本必须先把节点组起来
#    （headless Service + 共享 cookie + RELEASE_NODE / CLUSTER_QUERY / MIN_CLUSTER_SIZE…），
#    而且跨节点重连还要网关重放 409。可直接粘贴的完整配方见 ../README.md 的「扩容（多副本）」。

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo-relay
  namespace: paseo-relay
  labels:
    app.kubernetes.io/name: paseo-relay
    app.kubernetes.io/part-of: paseo-relay
spec:
  # 单实例。改大之前先读 ../README.md 的「扩容（多副本）」——
  # 否则会变成 N 个互不相识的节点各自为政（客户端重连会收到 409）。
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 先起新的、再删旧的：换版本时不出现服务空窗。
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paseo-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paseo-relay
        app.kubernetes.io/part-of: paseo-relay
    spec:
      # 与上游 Fly 的 kill_timeout = 30s 对齐：给它时间把在途帧发完 / 关掉连接。
      terminationGracePeriodSeconds: 30
      containers:
        - name: relay
          image: ghcr.io/smagicalk/paseo-relay:latest
          # 镜像由本仓库 CI 构建、标签是 latest：必须每次拉取，否则节点上会一直复用旧镜像。
          imagePullPolicy: Always
          env:
            # ── 监听（镜像里已设成这两个值，写出来是为了显眼）────────────
            - name: PASEO_RELAY_HOST
              value: 0.0.0.0
            - name: PASEO_RELAY_PORT
              value: "4000"
            # ── 单实例：关掉 Erlang 分布 ───────────────────────────────
            # 不需要节点发现，也就不起 epmd、不监听 4369（实测无副作用：/ready 200、0 报错）。
            # 多副本时要改成 name，并补齐 RELEASE_NODE / RELEASE_COOKIE / CLUSTER_QUERY 等（见 README）。
            - name: RELEASE_DISTRIBUTION
              value: none
            # ── 运行时小修 ────────────────────────────────────────────
            # 镜像的运行时基础层没设 locale，不设这两项启动时会警告 latin1
            # （上游 Fly 适配层也设了 ELIXIR_ERL_OPTIONS=+fnu）。
            - name: LANG
              value: C.UTF-8
            - name: ELIXIR_ERL_OPTIONS
              value: +fnu
          ports:
            - name: relay
              containerPort: 4000
          # 上游语义：/health 只证明 HTTP 进程活着；/ready 才是「能不能接新活」
          # （draining、容量/内存压力时返回 503）。所以 liveness 用 /health、readiness 用 /ready
          # —— 反过来会变成重启风暴。
          startupProbe:
            httpGet:
              path: /health
              port: relay
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: relay
            periodSeconds: 10
            # /ready 内部有自己的状态窗口（上游按秒描述），给 3 秒余量。
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: relay
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # 先把 Pod 标成 Terminating（客户端端点被摘掉），再让它优雅收尾。
              exec:
                command: ["sh", "-c", "sleep 5"]
          # 与上游 Fly 的机型对齐（1 性能核 / 2GB）；默认上限是每节点 2 万条 WebSocket
          # （100 acceptors × 200 connections_per_acceptor），内存随流量涨，按需调大。
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            # 镜像以 root 运行（上游 Dockerfile 没有 USER），但不需要任何提权：
            # 监听 4000、在 /app 下读写自己的文件而已。
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

---
# 客户端 / 网关用的入口。
apiVersion: v1
kind: Service
metadata:
  name: paseo-relay
  namespace: paseo-relay
  labels:
    app.kubernetes.io/name: paseo-relay
    app.kubernetes.io/part-of: paseo-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paseo-relay
  ports:
    - name: relay
      port: 4000
      targetPort: relay

---
# ── 对外暴露：Gateway API（HTTPRoute）示例（可选；公网使用必配 TLS）──────────
# 用你集群里现成的 Gateway（示例是 istio-system 里的 istio-gateway）。
# 后端是上面的 Service `paseo-relay`（4000）。
#
# 三点注意：
#   1. TLS 在**网关的 listener** 上（parentRefs 里 https 那一段），HTTPRoute 里不用写 tls。
#   2. **必须关超时**：这是 WebSocket 长连接，网关的默认超时（Envoy 的 route timeout 默认
#      15 秒）会把连接掐断 —— 示例按规范把 timeouts.request / backendRequest 设成 0s
#      （规范原文：zero duration（"0s"）SHOULD disable the timeout completely）。
#   3. 跨命名空间挂载要网关允许：本路由在 paseo-relay、网关在 istio-system，需要网关
#      listener 的 allowedRoutes.namespaces.from 允许，否则路由会被**静默忽略**
#      （kubectl get httproute -n paseo-relay 看 Accepted / ResolvedRefs）。
#
# ⚠️ 单实例不会遇到第 4 点；一旦扩成多副本就有：非 owner 节点会对升级请求返回 **409** +
#    reroute 头（默认 x-reroute-target），要由**部署方的代理**把请求重放到 owner ——
#    k8s 里没有现成适配器，详见 ../README.md「单副本 vs 多副本」。
#
# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: paseo-relay
#   namespace: paseo-relay
# spec:
#   parentRefs:
#     - name: istio-gateway
#       namespace: istio-system
#       sectionName: http
#     - name: istio-gateway
#       namespace: istio-system
#       sectionName: https
#   hostnames:
#     - relay.example.com
#   rules:
#     - matches:
#         - path:
#             type: PathPrefix
#             value: /
#       backendRefs:
#         - name: paseo-relay
#           port: 4000
#       # WebSocket 长连接不被超时掐断（0s = 关闭）
#       timeouts:
#         request: 0s
#         backendRequest: 0s
