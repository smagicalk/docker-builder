# Redis：跨实例协调、Pub/Sub、Timeline 的序号与写缓冲。
#
# ⚠️ 参数照上游 compose 抄，**别改**：
#   · AOF 开着（--appendonly yes --appendfsync everysec），RDB 关掉（--save ""）
#   · --maxmemory-policy noeviction（这些 key 没有 TTL，被驱逐 = 丢数据）
# 上游文档原话：pending 的 Timeline/seq 键没有 TTL，所以它靠 AOF + 持久卷 + noeviction 来兜底。
#
# 也别设 runAsNonRoot：官方 redis 镜像的入口脚本同样要先 root 改 /data 属主再降权。

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agents-anywhere-redis
  labels:
    app.kubernetes.io/part-of: agents-anywhere
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/agents-anywhere/redis
    type: DirectoryOrCreate
  claimRef:
    namespace: agents-anywhere
    name: agents-anywhere-redis

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-anywhere-redis
  namespace: agents-anywhere
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agents-anywhere
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: agents-anywhere
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: agents-anywhere
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          # 与上游 compose 的 command 逐条对应（RDB 关、AOF everysec、256mb、noeviction）。
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          # 与上游 healthcheck 同款：redis-cli ping。
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              # 给 AOF 重写与 maxmemory 留出余量（maxmemory 是 256mb）。
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agents-anywhere-redis

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agents-anywhere
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: agents-anywhere
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
