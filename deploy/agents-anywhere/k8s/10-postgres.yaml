# PostgreSQL：整套服务的**唯一事实来源**（会话、Timeline、账号……都在这）。
# 版本与参数照上游 docker/docker-compose.postgres.yml：postgres:17-alpine，库/用户都叫 agents_anywhere。
#
# ⚠️ 别给这个容器设 `runAsNonRoot` —— 官方 postgres 镜像的入口脚本要先以 root 身份把数据目录
#    的属主改成 postgres(999)，再降权启动；强制非 root 会让它直接起不来。Redis 同理（见 20-redis.yaml）。

# ── 两种用法，按需 apply（这份文件把两者都留着）────────────────────
#   · 用**外部** PostgreSQL（当前方案）：只 apply 本文件**最后那个 Service**（ExternalName，
#     把服务名 postgres 指到外部主机）。前面的 PV/PVC/Deployment 是自建时才用 —— 别一起 apply，
#     否则会白起一个 Postgres 容器，它还会在自己的空目录里 initdb 出一个**空库**。
#   · 自建（这个 Deployment）：apply 整个文件。

---
# 数据盘。hostPath 静态供给（你集群没有默认 StorageClass），Retain：删 PVC 不删数据。
# 多节点集群必须给 PV 钉节点或换 CSI，否则 Pod 落到别的节点会看到「空库」——
# 详见 README 的「多节点」一节。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agents-anywhere-postgres
  labels:
    app.kubernetes.io/part-of: agents-anywhere
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  # 空字符串 = 静态供给（不走 StorageClass）。必须与 PVC 一致。
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/agents-anywhere/postgres
    type: DirectoryOrCreate
  # 钉住目标 PVC：静态供给时若不加 claimRef，别的 PVC 可能先把这块 PV 抢走。
  claimRef:
    namespace: agents-anywhere
    name: agents-anywhere-postgres

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-anywhere-postgres
  namespace: agents-anywhere
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agents-anywhere
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agents-anywhere
spec:
  # 外部依赖模式（当前用法）：默认 0 副本 —— 这个 Postgres 不跑，apply 整个目录也不会白起
  # 容器。要改成自建：这里改回 1，并把本文件最后那个 Service 从 ExternalName 换回 ClusterIP。
  replicas: 0
  strategy:
    # 单实例数据库：不允许新旧两个 Postgres 同时挂同一份数据目录。
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: agents-anywhere
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: agents_anywhere
            - name: POSTGRES_USER
              value: agents_anywhere
            # 密码只在 Secret 里（命令见 30-server.yaml 顶部）。
            # 用 `openssl rand -hex 32` 生成：只含 0-9a-f，拼进 DB URL 不需要转义。
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agents-anywhere-secret
                  key: postgres-password
            # 连接数上限：默认 100。上游给「4 worker」那份 profile 才提到 200
            # （每个 worker 的连接池是 10 + 20 overflow）—— 你要加 worker 就同步提这个值。
            # - name: POSTGRES_INITDB_ARGS
            #   value: "--data-checksums"
          ports:
            - name: pg
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agents-anywhere-postgres

---
# 桥接：把服务名 postgres 指到**外部** PostgreSQL。K8s 的 ExternalName 就是一条 DNS CNAME，
# 不做代理、也不做端口转换 —— 所以 30-server.yaml 里 AGENT_SERVER_DB_URL 的 `@postgres:5432`
# 不用改，原样就能连上外部库。
# ⚠️ 三个要知道的点：
#   1. externalName 只能填**域名**（CNAME 语义），填 IP 不生效。你的外部库只有 IP 的话，
#      不要用 ExternalName，直接在 30-server.yaml 的 AGENT_SERVER_DB_URL 里写 IP:端口。
#   2. 不做端口转换：客户端拨的就是 URL 里的 5432，所以外部库必须监听 5432；
#      不是的话改 URL 里的端口（这里改没用）。
#   3. 集群节点要能解析并**直连**这个域名；跨公网的话请自己加密（TLS 端点 / 隧道 / WireGuard），
#      数据库流量默认是明文。
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agents-anywhere
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agents-anywhere
spec:
  type: ExternalName
  externalName: pg.example.com        # ← 换成你的外部 PostgreSQL 主机名
  ports:
    - name: pg
      port: 5432
