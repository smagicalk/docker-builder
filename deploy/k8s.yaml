# workbuddy2api 在 Kubernetes 上的最小可用部署（对应仓库根目录的 docker-compose.yml）。
#
# 镜像与 compose 用的是同一个：ghcr.io/smagicalk/workbuddy2api:latest
# 与 Docker 部署的差异只有三处，都是刻意的：
#   · auths/ 与 data/ 换成两个 PVC（持久数据，丢了要重新扫码 / 丢账号池状态）
#   · config.json 放 ConfigMap；api_key 单独走 Secret + 环境变量 WB2A_API_KEY 注入
#     （上游本身支持环境变量覆盖配置），所以密钥不会出现在 ConfigMap 里
#   · 卷属主用 securityContext.fsGroup=10001 解决，不用手工 chown
#
# ── 用法 ────────────────────────────────────────────────────────
#   kubectl apply -f deploy/k8s.yaml
#   kubectl rollout status deploy/workbuddy2api
#   kubectl exec -it deploy/workbuddy2api -- ./login.sh --realm=cn   # 扫码加账号
#   kubectl port-forward svc/workbuddy2api 7863:7863                 # 本机验证
#   curl -s http://127.0.0.1:7863/healthz
#
# ── 三个必须知道的点 ────────────────────────────────────────────
#   1. replicas 固定为 1，别直接扩。账号池是「单进程本地状态 + 本地 auths 目录」：
#      多副本会各自把定时任务跑一遍（重复签到 / 重复领奖，对上游不友好、还有
#      WAF 风险），并且争抢同一份 state.json。真要扩容，先关掉 schedule.*
#      （见 ConfigMap），否则只加副本数会出事。
#   2. 探针刻意用 TCP，不用 /healthz。/healthz 是**应用层**语义：账号池为空时它
#      返回 503（见上游 handler.go 的 Pool.ServableNow()）。拿它当 liveness 会让
#      Pod 反复重启；当 readiness 会让「还没加账号」时 Service 不转发，连扫码加
#      账号都做不了。所以 TCP 判进程活着，/healthz 留给负载均衡 / 面板判断。
#   3. config.json 只读挂载 —— 程序不写它。改配置改 ConfigMap 后
#      `kubectl rollout restart deploy/workbuddy2api`。
#
# ⚠️ 这份清单不是「安全加固过的生产模板」：它把网关只放在 ClusterIP 后面，
#    对外暴露请自己在 Ingress 上加 TLS（见文件末尾注释的示例）。

apiVersion: v1
kind: Secret
metadata:
  name: workbuddy2api-secret
type: Opaque
stringData:
  # 换成你自己的随机值，例如：openssl rand -hex 32
  # 客户端调用时带 Authorization: Bearer <这个值>。
  #
  # 更推荐不把这个值写进 YAML，改用命令创建（二选一；用命令的话可以把下面
  # apply 的 Secret 单独跳过）：
  #   kubectl create secret generic workbuddy2api-secret \
  #     --from-literal=api_key="$(openssl rand -hex 32)" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  api_key: "CHANGE_ME_替换成你自己的随机值"

---
# 非密钥配置全放这里。api_key 故意留空 —— 真值由 Secret 经 WB2A_API_KEY 覆盖注入。
# 字段含义见上游 config.example.json；这里给的是默认基线，可按需删减（缺的字段用默认值）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbuddy2api-config
data:
  config.json: |
    {
      "listen": ":7863",
      "api_key": "",
      "auth_dir": "/app/auths",
      "state_file": "/app/data/state.json",
      "cooldown": {
        "soft_rate": "600s",
        "soft_rate_max": "2h"
      },
      "schedule": {
        "checkin_hours": [9, 21],
        "travel_hours": [9, 21],
        "activity_hours": [10],
        "keepalive_hours": [22],
        "school_hours": [12],
        "cat_hours": [1],
        "checkin_enabled": true,
        "travel_enabled": true,
        "activity_enabled": true,
        "keepalive_enabled": true,
        "school_enabled": true,
        "cat_enabled": true
      },
      "admin": {
        "enabled": false
      },
      "global": {
        "enabled": true,
        "chat_base": "",
        "billing_base": ""
      },
      "upstream": {
        "timeout_seconds": 120,
        "header_timeout_seconds": 120,
        "idle_timeout_seconds": 300,
        "user_agent": "",
        "client_version": "",
        "cli_version": "",
        "device_token": "",
        "device_token_file": "",
        "client_name": "WorkBuddy",
        "passthrough_ip": false
      },
      "features": {
        "sanitize_blacklist_fingerprints": true
      },
      "prompt": {
        "mode": "passthrough",
        "file": ""
      },
      "upstash": {
        "url": "",
        "token": ""
      },
      "pool": {
        "max_in_flight": 3,
        "max_in_flight_global": 2,
        "breaker_threshold": 3,
        "breaker_cooldown": "30m",
        "breaker_cooldown_max": "6h",
        "degrade_threshold": 5,
        "degrade_cooldown": "10m",
        "degrade_cooldown_max": "2h",
        "idle_weight_per_hour": 0.5,
        "idle_weight_max": 5.0,
        "expiring_soon": "168h",
        "cost_explore_interval": "30m"
      },
      "session_sticky": {
        "enabled": true,
        "ttl": "30m",
        "gc_interval": "5m"
      }
    }

---
# 账号凭证（扫码后落盘在这里）。**丢了要重新扫码**，别用临时卷。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-auths
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # 不写 storageClassName = 用集群默认 StorageClass。
  # 集群没有默认 SC 时必须显式填（kubectl get storageclass 看）。
  # storageClassName: standard

---
# 账号池状态：state.json 与模型账本（model.json 落在 state_file 同目录）。
# 丢了不致命，但重启后冷却状态与账本要重新学，建议持久化。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbuddy2api
  labels:
    app: workbuddy2api
spec:
  # 见文件开头第 1 条：账号池是单实例的本地状态，别扩。
  replicas: 1
  strategy:
    # Recreate 而不是 RollingUpdate：滚动更新会短暂同时存在两个 Pod，
    # 都挂同一个 RWO 卷、都写同一份 state.json。宁可停一下再起。
    type: Recreate
  selector:
    matchLabels:
      app: workbuddy2api
  template:
    metadata:
      labels:
        app: workbuddy2api
    spec:
      # 镜像本身就是 uid 10001(app)，这里对齐；fsGroup 让 PVC 直接可写 ——
      # 等价于 Docker 部署里的 chown -R 10001:10001 auths data。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: workbuddy2api
          image: ghcr.io/smagicalk/workbuddy2api:latest
          # 要可复现（不被下一次上游重建影响）就钉内容寻址标签：
          #   image: ghcr.io/smagicalk/workbuddy2api:sha256-6d3582fcedbb
          # 上游换附件后重建，标签仍是 latest，所以必须每次拉取，
          # 否则节点上的旧镜像会一直被复用。
          imagePullPolicy: Always
          env:
            # 定时任务里「几点执行」按进程本地时区判定（上游 nowFunc = time.Now），
            # 所以固定成 CST，让 ConfigMap 里的 9 / 21 点就是北京时间。
            - name: TZ
              value: Asia/Shanghai
            # 这三个用环境变量显式钉住，不依赖 config.json 里的相对路径。
            - name: WB2A_LISTEN
              value: ":7863"
            - name: WB2A_AUTH_DIR
              value: /app/auths
            - name: WB2A_STATE_FILE
              value: /app/data/state.json
            # 密钥从这里进来，覆盖 config.json 里的空 api_key。
            - name: WB2A_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workbuddy2api-secret
                  key: api_key
          ports:
            - name: http
              containerPort: 7863
          # 启动可能因为账号多而稍慢，用 startupProbe 挡住 liveness，
          # 免得启动期被误判成卡死而反复重启。
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # 流式转发是 IO 密集，CPU 上限给太紧会拖慢首字延迟，按机器调整。
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            # auths 必须可写：扫码落盘、令牌刷新都是 tmp+rename 回写。
            - name: auths
              mountPath: /app/auths
            - name: data
              mountPath: /app/data
            # login.sh 等 python 脚本可能要写临时文件，给一个可写的 /tmp。
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: workbuddy2api-config
        - name: auths
          persistentVolumeClaim:
            claimName: workbuddy2api-auths
        - name: data
          persistentVolumeClaim:
            claimName: workbuddy2api-data
        - name: tmp
          emptyDir: {}

---
# 只集群内可达。这个网关持有全部账号凭据，对外务必套 TLS（见下面注释的 Ingress）。
apiVersion: v1
kind: Service
metadata:
  name: workbuddy2api
  labels:
    app: workbuddy2api
spec:
  type: ClusterIP
  selector:
    app: workbuddy2api
  ports:
    - name: http
      port: 7863
      targetPort: http

---
# ── 可选：对外暴露 ────────────────────────────────────────────────
# 取消注释并改成你的域名。网关会流式返回（SSE），反代必须关缓冲、放宽超时，
# 否则「流式」会被中间层攒成一整块，等于把流式白做了。
