# WorkBuddy Manager（管理面板 + 对外反代网关）—— 整套部署的入口。
# 镜像用官方发布的那份：ghcr.io/ithtelab/workbuddy-manager:latest（多架构，已验证可匿名拉取）
#
# 部署顺序：00-namespace → 建 Secret → 10-upstream → 本文件
#   kubectl apply -f deploy/k8s/
#
# ── 与上游分开部署 ────────────────────────────────────────────────
# 本文件与 10-upstream.yaml 是**两套独立的部署**：面板**不挂上游的任何目录**，
# 只通过 Service 走 HTTP 连过去（WB2API_BASE=http://workbuddy2api:7863）。
# 好处是两套互不等待、各自调度、各自升级重启 —— 上游没起来，面板照样 Running，
# 界面显示「上游不可用」而不是卡在 Pending。
#
# 代价（两个功能，原因在上游的设计里）：上游既没有「加账号」的 HTTP 接口，
# 也没有热改配置的接口，那两项在天生要靠直接读写上游的 auths/ 与 config.json：
#   · 「扫码添加账号」→ 改用上游容器内登录：
#       kubectl -n workbuddy exec -it deploy/workbuddy2api -- ./login.sh --realm=cn
#       （加完不用重启：上游每 5 秒扫一次 auths/，自动进池）
#   · 「设置页保存」→ 直接改上游的 config.json，再重启上游。两种做法：
#       ① 拽到本机改好再塞回去（顺手；容器里有 tar）
#          POD=$(kubectl -n workbuddy get pod -l app.kubernetes.io/name=workbuddy2api \
#                  -o jsonpath='{.items[0].metadata.name}')
#          kubectl -n workbuddy cp "$POD:/app/config.json" ./config.json
#          #   ……用你习惯的编辑器改 ./config.json……
#          kubectl -n workbuddy cp ./config.json "$POD:/app/config.json"
#          kubectl -n workbuddy rollout restart deploy/workbuddy2api
#       ② 就地用 python 改一个字段（上游镜像里没有 vi，但有 python3）
#          kubectl -n workbuddy exec -it deploy/workbuddy2api -- python3 -c \
#            "import json;p='/app/config.json';c=json.load(open(p));c['schedule']['checkin_hours']=[8,20];json.dump(c,open(p,'w'),ensure_ascii=False,indent=2)"
#     /app/config.json 是 subPath 单文件挂载，可写，改动会落到配置卷上。
# 其余功能（仪表盘、账号列表、密钥分发、请求日志、用量统计、IP 管控、模型中心、
# 聊天测试台）全部只走 HTTP，照常可用。
#
# 有 RWX 存储（NFS / CephFS / Longhorn 等）的话可以切回「共享卷」模式，
# 把上面两项功能找回来 —— 具体改法见 deploy/k8s/README.md。
#
# ── 存储对应表 ────────────────────────────────────────────────────
#   PV workbuddy-manager-data   hostPath /srv/workbuddy/manager/data  5Gi
#      → 挂面板 /app/data（面板独享）
#      里面放：manager.db（密钥 / 日志 / 用量 / 审计）、users.json（管理员与会话签名密钥）
#      丢了会怎样：要重新初始化管理员、已发会话全部失效、日志与用量统计丢失。
#
# ── 关于两个环境变量故意不设 ──────────────────────────────────────
# 镜像里 WB_AUTH_DIR / WB_UPSTREAM_CONFIG / WB_UPSTREAM_DIR 的默认值指向
# /opt/workbuddy2api/*，而 k8s 里**没有挂这个目录**，所以：
#   · 面板读不到上游配置 → 设置页会明确报错并锁定保存
#   · 账号页的「添加 / 移动 / 删除」会明确报错
# 这是**预期的降级**，不要用 emptyDir 之类把路径造出来「让它不报错」：
# 那会让保存操作看起来成功了，而上游根本读不到 —— 比报错更糟。
#
# ── 对外暴露 ──────────────────────────────────────────────────────
# 下游客户端连的是**面板**的 /v1（密钥、配额、IP 白名单、用量日志都在面板侧），
# 上游只跟面板对话，所以只有面板需要 Ingress。文件末尾有注释掉的示例，
# **务必配 TLS**：面板持有全部账号凭据。

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy-manager-data
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  # Retain：删 PVC 不删数据。users.json 里的会话签名密钥丢了会让所有人重新登录，
  # 数据库丢了统计与审计就没了 —— 都别指望它自动清理。
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/manager/data
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy-manager-data
  # 多节点：换成 NFS / 本地盘 + nodeAffinity，写法见 10-upstream.yaml 里的注释。

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy-manager-data
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
# 管理面板的初始密码：**可选**，同样不放在清单里。
#   · 不建 → 面板首启随机生成一个并打进容器日志：
#       kubectl -n workbuddy logs deploy/workbuddy-manager | grep -A2 密码
#   · 建   → 用你给的密码。必须在面板**第一次启动之前**建好；已经首启过就不生效了
#            （密码已写进 users.json，那时改用界面的「管理用户」改）。
#
#   kubectl -n workbuddy create secret generic workbuddy-manager-secret \
#     --from-literal=admin-password="$(openssl rand -base64 18)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 同理不做进清单（会被 apply 覆盖）。想用 YAML 就取消注释下面这段：
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: workbuddy-manager-secret
#   namespace: workbuddy
# type: Opaque
# stringData:
#   admin-password: "换成你的强密码"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbuddy-manager
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy-manager
    app.kubernetes.io/part-of: workbuddy
spec:
  replicas: 1
  strategy:
    # 面板自己也有一块 RWO 数据卷：滚动更新时新旧 Pod 不能同时挂它。
    # 换来的是可以放心重启/升级，不影响上游。
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workbuddy-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbuddy-manager
        app.kubernetes.io/part-of: workbuddy
    spec:
      # 与上游同一个 uid：全部服务都用 10001，跨组件看文件时不会有权限困惑
      # （官方镜像自己也用 10001，就是为了和上游对齐）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # 这里**没有** podAffinity：面板不挂上游的卷，所以两边可以落在不同节点。
      containers:
        - name: workbuddy-manager
          image: ghcr.io/ithtelab/workbuddy-manager:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Shanghai
            # 上游地址：同一命名空间里直接用 Service 名。镜像里的默认值是
            # 127.0.0.1:7863，在容器里指向自己，**必须覆盖**。
            - name: WB2API_BASE
              value: http://workbuddy2api:7863
            # 与上游之间的鉴权密钥：**与上游共用同一个 Secret**
            # （同一个命名空间才能这样引用）。改成与上游一致的值即可。
            - name: WB2API_KEY
              valueFrom:
                secretKeyRef:
                  name: workbuddy2api-secret
                  key: api_key
            # 首启管理员密码（留空则随机生成并打日志）。
            - name: WB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workbuddy-manager-secret
                  key: admin-password
                  optional: true
            # 真实 IP：Ingress 后面的反代（ingress-nginx 默认就会带 X-Real-IP）。
            # 默认已是 1；若前面再叠一层 CDN，把它改成 CDN+反代的层数。
            - name: WB_TRUST_PROXY
              value: "1"
            - name: WB_TRUSTED_PROXY_HOPS
              value: "1"
            # 生产环境不暴露 /docs 与 /openapi.json（默认也是 0，写出来是为了显眼）。
            - name: WB_ENABLE_DOCS
              value: "0"
          ports:
            - name: http
              containerPort: 7864
          # 面板自己的健康检查 /api/healthz 只返回 {'ok': true}，**不依赖上游**
          # （源码 server/routers/auth.py），所以可以直接当探针用 ——
          # 上游挂了面板仍然是 Ready，界面才能照常显示「上游不可用」。
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 面板自己的数据：SQLite + users.json。必须持久化。
            - name: manager-data
              mountPath: /app/data
      volumes:
        - name: manager-data
          persistentVolumeClaim:
            claimName: workbuddy-manager-data

---
apiVersion: v1
kind: Service
metadata:
  name: workbuddy-manager
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy-manager
    app.kubernetes.io/part-of: workbuddy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workbuddy-manager
  ports:
    - name: http
      port: 7864
      targetPort: http

---
# ── 对外入口（可选，但公网使用必配 TLS）────────────────────────────
# 面板会流式返回（SSE）：反代必须关缓冲、放宽超时，否则「流式」会被中间层
# 攒成一整块，等于把流式白做了。
#
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: workbuddy-manager
#   namespace: workbuddy
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-buffering: "off"
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
#     # 面板的网关请求体上限是 8 MiB（WB_GATEWAY_MAX_BODY_MB），这里给足。
#     nginx.ingress.kubernetes.io/proxy-body-size: "16m"
# spec:
#   ingressClassName: nginx
#   tls:
#     - hosts: ["wb.example.com"]
#       secretName: workbuddy-tls
#   rules:
#     - host: wb.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: workbuddy-manager
#                 port:
#                   number: 7864
