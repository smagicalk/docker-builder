# WorkBuddy 整套部署：上游网关 workbuddy2api + 管理面板 workbuddy-manager，**一个 Deployment**。
# 镜像：上游 ghcr.io/smagicalk/workbuddy2api:latest（**本仓库自动构建**）
#       面板 ghcr.io/ithtelab/workbuddy-manager:latest（官方发布，多架构）
#
# 部署顺序：00-namespace → 建两个 Secret → 本文件
#   kubectl apply -f deploy/k8s/
#
# ── 为什么把两个容器放进同一个 Pod ────────────────────────────────
# 上游既没有「加账号」的 HTTP 接口，也没有热改配置的接口：面板那两项功能天生要靠
# **直接读写上游的 auths/ 与 config.json**。放进同一个 Pod，这两件事就退化成「挂同一块
# 卷」—— kubelet 只挂一次，再按 subPath / 目录 bind 给两个容器，于是：
#   · 不需要 podAffinity：RWO 卷「只能挂在一个节点」的约束天然满足，同一个 Pod 不可能跨节点；
#   · 面板直接用回环连上游（WB2API_BASE=http://127.0.0.1:7863），不必经过 Service；
#   · 「扫码添加账号」回来了：面板的 WB_AUTH_DIR 默认就是 /opt/workbuddy2api/auths，
#     和上游的 /app/auths 是同一块卷 —— 面板写进去，上游每 5 秒扫一次自动进池；
#   · 「设置」页保存回来了：面板与上游读写的是**同一个 config.json**（同一个 inode）。
#     改完由上游容器里的 supervisor **自动生效**（2~5 秒）—— 见下面 workbuddy2api 容器的 command/args。
#
# 代价（这些若对你更重要，就该拆回两个 Deployment，本目录历史版本就是这么做的）：
#   · **Pod Ready 是聚合的**：Service 的 endpoint 以 Pod 为单位 —— 上游容器崩了，整个
#     Pod 不算 Ready，面板的 Service 也就不再有 endpoint。而「上游挂了还想打开面板看
#     日志、改配置」恰恰是最需要面板的时候。
#   · **镜像拉取是单点**：两个容器都是 :latest + Always，任一方在 registry 抖动或被删
#     tag → Pod 起不来 → 两个一起不可用。
#   · **重启粒度粗**：只能整 Pod（见上），不能只重启上游。
#
# ── 存储对应表（四块，两块共享）──────────────────────────────────
#   PV workbuddy2api-config    hostPath /srv/workbuddy/upstream/config   1Gi  ← 共享
#      → 上游 /app/config.json（单文件 subPath、只读）＋ 面板 /opt/workbuddy2api/config.json（读写）
#      里面放：config.json（上游全部配置：定时任务 / 限流 / 并发 / 提示词 …）
#      丢了会怎样：由 init 容器写一份默认基线（密钥不在里面）
#   PV workbuddy2api-auths     hostPath /srv/workbuddy/upstream/auths    1Gi  ← 共享
#      → 上游 /app/auths ＋ 面板 /opt/workbuddy2api/auths
#      里面放：auths/workbuddy-<uid>.json（每个账号一份凭证）
#      丢了会怎样：**要重新扫码加号**。这是最该备份的一个。
#   PV workbuddy2api-pool      hostPath /srv/workbuddy/upstream/pool     1Gi  ← 上游独享
#      → 上游 /app/data（state.json 积分/冷却/熔断、model.json 成本账本）
#      面板**刻意不挂**：那是上游进程的活状态，两个进程同时写只会互相覆盖。
#      丢了会怎样：不致命，但冷却状态与便宜号账本要重新学。
#   PV workbuddy-manager-data  hostPath /srv/workbuddy/manager/data      5Gi  ← 面板独享
#      → 面板 /app/data（manager.db 密钥/日志/用量/审计、users.json 管理员与会话签名密钥）
#      丢了会怎样：要重新初始化管理员、已发会话全部失效、日志与用量统计丢失。
#
# 密钥不在这四块卷里：由 Secret 经 WB2A_API_KEY / WB2API_KEY 注入（文件里的 api_key 恒为空）。
#
# hostPath 最省事、最透明，代价是**数据绑在节点上**：多节点集群里 Pod 可能被调度到另一台
# 节点，那里看到的是空目录 —— 表现为「账号池变 0、配置回到默认基线」，很像数据丢了。
# 所以多节点集群必须二选一（写法见 deploy/k8s/README.md 的「多节点集群」一节）：
#   · 给下面四个 PV 都加 nodeAffinity，把 Pod 钉在有数据的那一台；或
#   · 换成 NFS / 云盘 CSI（动态供给）：把本文件的 PV 全删掉、给 PVC 填上 storageClassName。
# reclaimPolicy 一律 Retain：删 PVC **不会**删数据，要清干净得自己上节点删目录。
#
# ── 五个必须知道的点 ──────────────────────────────────────────────
#   1. replicas 固定 1，别直接扩。账号池是「单进程本地状态 + 本地 auths 目录」：多副本会
#      各自把定时任务跑一遍（重复签到/领奖，还有 WAF 风险），并争抢同一份 state.json。
#      真要扩容，先关掉 config.json 里的 schedule.* 开关。
#   2. 两个容器的探针刻意不同：上游用 **TCP**，不用 /healthz —— /healthz 在账号池为空时
#      返回 503（应用层语义，见上游 handler.go 的 Pool.ServableNow()），当 liveness 会让
#      Pod 反复重启，当 readiness 会让「还没加账号」时 Service 不转发、连登录加号都做不了。
#      面板用 /api/healthz（源码 server/routers/auth.py 只返回 {'ok': True}，不依赖上游）。
#   3. 配置有**唯一真源**：配置卷上的 config.json。清单里**没有** ConfigMap 那一层
#      —— 那种「改了却对运行中的部署没用」的影子副本最容易骗人。所以：
#        面板「设置」页保存 或 直接改宿主机上的那个文件 → **永久生效**，重启不丢；
#        改完由上游容器里的 supervisor **自动重启上游进程**（2~5 秒生效），不用手动做什么；
#        想手动重启也可以：kubectl -n workbuddy rollout restart deploy/workbuddy
#   4. 面板的另一个「看着像成功其实没用」的坑已经没有了：auths/ 现在是真的共享目录，
#      写进去上游读得到（旧版本给 /opt/workbuddy2api 挂只读空卷正是为了挡住它）。
#   5. 上游的「重启上游 / 读上游日志 / 一键更新」这几个面板功能在 K8s 下会降级报错
#      （没有 docker 守护进程，也没有上游工作目录），用 kubectl 代替，见 README。
---
# 配置卷：**两个容器共享的唯一真源** —— 面板「设置」页保存改的就是这个文件，上游启动时读它。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-config
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  # 空字符串 = 静态供给（不走 StorageClass 动态创建）。必须与 PVC 一致。
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/config
    type: DirectoryOrCreate
  # 钉住目标 PVC：静态供给时若不加 claimRef，别的 PVC 可能先把这块 PV 抢走。
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-config

---
# 账号凭证卷：**最该备份的一个**，也是两个容器共享的那块。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-auths
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/auths
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-auths

---
# 账号池状态卷：丢了不致命，重建即可。上游独享。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-pool
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/pool
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-pool

---
# 面板数据卷：SQLite + users.json，面板独享。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy-manager-data
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  # Retain：删 PVC 不删数据。users.json 里的会话签名密钥丢了会让所有人重新登录，
  # 数据库丢了统计与审计就没了 —— 都别指望它自动清理。
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/manager/data
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy-manager-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-config
  namespace: workbuddy
spec:
  # 必须与 PV 一致（静态供给时两边要么同时为空字符串，要么同时填同一个名字）。
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-auths
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-pool
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy-manager-data
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
# ⚠️ 这两个 Secret **故意不放在清单里** —— 请先手动建，再 apply 本文件。
#    放进去的话，每次 `kubectl apply -f deploy/k8s/` 都会用文件里的占位值把你刚设的
#    真密钥覆盖回去。密钥的真源只应该有一处。
#
#  1) workbuddy2api-secret（**必建**，两个容器都要它）：
#       · 上游当 WB2A_API_KEY：上游自身的鉴权密钥（配置文件里的 api_key 恒为空、被忽略）
#       · 面板当 WB2API_KEY：面板与上游之间的鉴权
#     kubectl -n workbuddy create secret generic workbuddy2api-secret \
#       --from-literal=api_key="$(openssl rand -hex 32)" \
#       --dry-run=client -o yaml | kubectl apply -f -
#
#  2) workbuddy-manager-secret（可选，只是面板的初始密码）：
#       · 不建 → 面板首启随机生成一个并打进容器日志（README 有捞法）
#       · 建   → 用你给的密码；必须在面板**第一次启动之前**建好，已经首启过就不生效了
#     kubectl -n workbuddy create secret generic workbuddy-manager-secret \
#       --from-literal=admin-password="$(openssl rand -base64 18)" \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# 缺 workbuddy2api-secret 时 Pod 会明确报 CreateContainerConfigError（不会静默降级）。
# 想坚持用 YAML 管密钥，就取消注释下面这段，并保证它排在 Deployment 之前：
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: workbuddy2api-secret
#   namespace: workbuddy
# type: Opaque
# stringData:
#   api_key: "换成你自己的随机值（openssl rand -hex 32）"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbuddy
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy
    app.kubernetes.io/part-of: workbuddy
spec:
  # 见文件开头第 1 条：账号池是单实例的本地状态，别扩。
  replicas: 1
  strategy:
    # 不用 RollingUpdate：滚动时新旧 Pod 会同时持有同一份 state.json 与 auths/。
    # 宁可停一下再起。
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workbuddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbuddy
        app.kubernetes.io/part-of: workbuddy
    spec:
      # 两个镜像都用 uid 10001(app)；fsGroup 让 PV 目录直接可写 ——
      # 等价于 Docker 部署里的 chown -R 10001:10001 auths data。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # 初始化容器：配置卷（hostPath）初始是空目录，而两个容器都用 subPath 挂**单个文件**，
      # 文件不存在会直接挂载失败 —— 所以先由它写一份默认基线出来。
      # 只写一次：之后这个文件就是配置的唯一真源（面板保存的内容不会被覆盖）。
      # 为什么非写不可：上游在配置文件缺失时**不会**退回默认值 —— 源码 cmd/server/main.go
      # 里本来有 os.IsNotExist 兜底（退回「默认值 + env」），但 Load() 把错误包成了
      # fmt.Errorf("read config: %w", err)，而 os.IsNotExist 只解 PathError/LinkError/
      # SyscallError 这类包装、认不出 fmt.wrapError → 兜底永不触发 → log.Fatalf → 容器
      # 以退出码 1 结束（已在真镜像里实测到那行 "load config: read config: open ...:
      # no such file or directory"）。上游哪天修了这个 %w，这个 init 才可以去掉。
      initContainers:
        - name: init-config
          image: ghcr.io/smagicalk/workbuddy2api:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # 配置的**唯一真源**就是卷上的 /cfg/config.json（下面两个容器共享的那一份）。
              # 这里只在它不存在时（全新部署 / 卷被清空）写一份默认基线 —— 没有 ConfigMap
              # 那层「改了却没用」的影子副本：此后面板「设置」页保存、或你直接改宿主机上的
              # 文件，写进去的内容**永久保留**，任何一次重启都不会被别的东西覆盖回去。
              # 唯一的例外是你自己删掉这个文件：那会被当作全新部署，重新写入下面的基线。
              if [ -f /cfg/config.json ]; then
                echo "[init] 配置卷上已有 config.json，保持不动（它是唯一真源）"
                exit 0
              fi
              echo "[init] 配置卷上还没有 config.json：写入一份默认基线"
              # 缺的字段上游会用内置默认值（含那套默认定时任务），所以这几段够用了。
              printf '%s\n' \
                '{' \
                '  "listen": ":7863",' \
                '  "api_key": "",' \
                '  "auth_dir": "./auths",' \
                '  "state_file": "./data/state.json",' \
                '  "cooldown": { "soft_rate": "600s", "soft_rate_max": "2h" },' \
                '  "schedule": {' \
                '    "checkin_hours": [9, 21],' \
                '    "travel_hours": [9, 21],' \
                '    "activity_hours": [10],' \
                '    "keepalive_hours": [22],' \
                '    "school_hours": [12],' \
                '    "cat_hours": [1],' \
                '    "checkin_enabled": true,' \
                '    "travel_enabled": true,' \
                '    "activity_enabled": true,' \
                '    "keepalive_enabled": true,' \
                '    "school_enabled": true,' \
                '    "cat_enabled": true' \
                '  },' \
                '  "admin": { "enabled": false },' \
                '  "global": { "enabled": true, "chat_base": "", "billing_base": "" },' \
                '  "upstream": { "timeout_seconds": 120, "header_timeout_seconds": 120, "idle_timeout_seconds": 300, "user_agent": "", "client_version": "", "cli_version": "", "device_token": "", "device_token_file": "", "client_name": "WorkBuddy", "passthrough_ip": false },' \
                '  "features": { "sanitize_blacklist_fingerprints": true },' \
                '  "prompt": { "mode": "passthrough", "file": "" },' \
                '  "upstash": { "url": "", "token": "" },' \
                '  "pool": { "max_in_flight": 3, "max_in_flight_global": 2, "breaker_threshold": 3, "breaker_cooldown": "30m", "breaker_cooldown_max": "6h", "degrade_threshold": 5, "degrade_cooldown": "10m", "degrade_cooldown_max": "2h", "idle_weight_per_hour": 0.5, "idle_weight_max": 5.0, "expiring_soon": "168h", "cost_explore_interval": "30m" },' \
                '  "session_sticky": { "enabled": true, "ttl": "30m", "gc_interval": "5m" }' \
                '}' > /cfg/config.json
              # 写完自检：这份基线必须是合法 JSON，否则上游启动会直接失败。
              python3 -c 'import json; json.load(open("/cfg/config.json")); print("[init] 基线 JSON 校验通过")'
              ls -l /cfg/config.json
          volumeMounts:
            - name: config
              mountPath: /cfg
      containers:
        # ── 上游网关 ────────────────────────────────────────────────
        - name: workbuddy2api
          image: ghcr.io/smagicalk/workbuddy2api:latest
          # 上游换附件后本仓库会重建镜像，标签仍是 latest：必须每次拉取，
          # 否则节点上会一直复用旧镜像。
          imagePullPolicy: Always
          # 要可复现（不被下一次上游重建影响）就钉内容寻址标签：
          #   image: ghcr.io/smagicalk/workbuddy2api:sha256-6d3582fcedbb
          # ── 让「保存即生效」在 K8s 里真的成立 ────────────────────────────
          # 上游只在**进程启动时**读一次 config.json（没有热重载）。面板「设置」页保存后
          # 会调 docker 重启上游容器 —— K8s 里没有 docker，那一步必然失败，于是「保存了
          # 却不生效」。这段极小的 supervisor 盯住 config.json 的**内容哈希**，一变就优雅
          # 重启上游进程：SIGTERM → 上游落盘 state 并等在途请求结束（其 main.go 的优雅停机），
          # 所以不会掐断正在进行的对话，面板与整个 Pod 也不受影响。
          # 顺带：进程意外退出（例如配置语义非法）会被重新拉起，跑得太短则 3 秒退避，不刷屏。
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CONFIG=/app/config.json
              CHILD=''
              INTERVAL=2

              # 容器停止时 kubelet 只给 PID 1（本 shell）发信号，必须由我们转发给子进程，
              # 否则上游来不及优雅停机（state 可能落不了盘）。
              forward_term() {
                if [ -n "$CHILD" ] && kill -0 "$CHILD" 2>/dev/null; then
                  echo "[supervisor] 转发 SIGTERM 给上游进程 $CHILD（它会落盘并等在途请求）"
                  kill -TERM "$CHILD" 2>/dev/null || true
                  wait "$CHILD" 2>/dev/null || true
                fi
              }
              on_signal() {
                echo "[supervisor] 收到停止信号，退出"
                forward_term
                exit 0
              }
              trap on_signal TERM INT

              # 内容哈希：文件不存在、或**还不是合法 JSON**（面板写文件是先截断再写）时输出空，
              # 于是不会因为读到半个文件而白白重启一次。
              config_hash() {
                [ -f "$CONFIG" ] || return 0
                python3 -c 'import json,sys;json.load(open(sys.argv[1]))' "$CONFIG" >/dev/null 2>&1 || return 0
                sha256sum "$CONFIG" | cut -d' ' -f1
              }

              while :; do
                /app/wb2api -config "$CONFIG" &
                CHILD=$!
                last="$(config_hash)"
                started=$(date +%s)
                while kill -0 "$CHILD" 2>/dev/null; do
                  sleep "$INTERVAL"
                  now="$(config_hash)"
                  if [ -n "$now" ] && [ "$now" != "$last" ]; then
                    echo "[supervisor] config.json 内容已变，优雅重启上游进程"
                    last="$now"
                    forward_term
                    break
                  fi
                done
                wait "$CHILD" 2>/dev/null || true
                CHILD=''
                ran=$(( $(date +%s) - started ))
                if [ "$ran" -lt 5 ]; then
                  echo "[supervisor] 上游进程只存活 ${ran}s 就退出，3 秒后重试"
                  sleep 3
                fi
              done
          env:
            # 定时任务里「几点执行」按进程本地时区判定（上游 nowFunc = time.Now），
            # 固定 CST 让 config.json 里的 9 / 21 点就是北京时间。
            # 面板也必须设成同一个值，否则界面上的时间与上游实际执行时间会差 8 小时。
            - name: TZ
              value: Asia/Shanghai
            # 密钥：config.json 里的 api_key 故意留空，由这个环境变量注入。
            # 上游支持 WB2A_* 覆盖配置，且覆盖发生在校验之前（cmd/server/config.go），
            # 所以文件里留空也没问题 —— 密钥只存在于 Secret 一处。
            - name: WB2A_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workbuddy2api-secret
                  key: api_key
          ports:
            # 名字必须与面板容器上的端口名不同：同一个 Pod 里两个容器都有 http 端口时，
            # Service 用「命名端口」转发会分不清该指向谁。
            - name: api
              containerPort: 7863
          # 启动可能因为账号多而稍慢，用 startupProbe 挡住 liveness，免得启动期被误判重启。
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # 流式转发是 IO 密集，CPU 上限过紧会拖慢首字延迟，按机器调整。
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 配置：单文件挂载，来自下面的 config PVC（**面板也挂它**）。
            # 上游自己不写它，写它的是面板；上游只在启动时读一次配置 ——
            # 但容器里的 supervisor 盯住**这个文件的内容**，一变就优雅重启上游进程（2~5 秒生效）。
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            # 账号凭证：扫码落盘、令牌刷新都是 tmp+rename 回写，必须可写。
            # 与面板的 /opt/workbuddy2api/auths 是同一块卷（面板加的号 5 秒内进池）。
            - name: auths
              mountPath: /app/auths
            - name: pool
              mountPath: /app/data

        # ── 管理面板（对外入口）────────────────────────────────────
        - name: workbuddy-manager
          image: ghcr.io/ithtelab/workbuddy-manager:latest
          imagePullPolicy: Always
          env:
            # 必须是同一个时区：面板展示的定时任务时间要跟上游的实际执行时间对得上。
            - name: TZ
              value: Asia/Shanghai
            # 上游地址：同一个 Pod，直接用回环（镜像默认值就是它，写出来是为了显眼）。
            # 注意：**只有同 Pod 才能这么写**；一旦拆成两个 Deployment 就得改成
            # http://workbuddy2api:7863（Service 名）。
            - name: WB2API_BASE
              value: http://127.0.0.1:7863
            # 与上游之间的鉴权密钥：与上游的 WB2A_API_KEY 是同一个 Secret 的同一把钥匙。
            - name: WB2API_KEY
              valueFrom:
                secretKeyRef:
                  name: workbuddy2api-secret
                  key: api_key
            # 首启管理员密码（留空则随机生成并打日志）。只在第一次启动时生效。
            - name: WB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workbuddy-manager-secret
                  key: admin-password
                  optional: true
            # 不用写 WB_UPSTREAM_CONFIG / WB_AUTH_DIR / WB_UPSTREAM_DIR：
            # 它们的默认值就是 /opt/workbuddy2api/{config.json,auths}，正好是下面挂进去的
            # 那块共享目录 —— 也正是官方 Docker 部署里 `../workbuddy2api:/opt/workbuddy2api` 的形态。
            # 真实 IP：Ingress 后面的反代（ingress-nginx 默认就会带 X-Real-IP）。
            # 默认已是 1；若前面再叠一层 CDN，把它改成 CDN+反代的层数。
            - name: WB_TRUST_PROXY
              value: "1"
            - name: WB_TRUSTED_PROXY_HOPS
              value: "1"
            # 生产环境不暴露 /docs 与 /openapi.json（默认也是 0，写出来是为了显眼）。
            - name: WB_ENABLE_DOCS
              value: "0"
          ports:
            - name: web
              containerPort: 7864
          # 面板自己的 /api/healthz 只返回 {'ok': true}，**不依赖上游**
          # （源码 server/routers/auth.py），所以可以直接当探针用。
          startupProbe:
            httpGet:
              path: /api/healthz
              port: web
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: web
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: web
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 面板自己的数据：SQLite + users.json。必须持久化。
            - name: manager-data
              mountPath: /app/data
            # 这里挂的是**两条子路径**（config.json 单文件 + auths 目录），不是整个目录：
            # 官方 docker-compose 挂的是「上游整个仓库目录」，但它在注释里写明这条替代做法
            # 同样可行（代价只是「更新上游」不可用）；而且在 K8s 里上游是**另一个容器**，
            # 那个仓库目录本来就不存在。面板的全部写入点只落在 config.json、auths/ 与
            # /app/data（另外 /app/.version 是自愈标记，官方 Docker 部署同样落在容器层），
            # 所以这两条子路径在文件层面是完备的 —— 逐条对照见 deploy/k8s/README.md。
            # 与上游**共享**的配置文件，读写挂载：「设置」页保存要真的落盘。
            # 与上游 /app/config.json 是同一个 inode（不是拷贝）。
            # 保存后由**上游容器里的 supervisor** 在 2~5 秒内优雅重启上游进程，无需手动操作。
            - name: config
              mountPath: /opt/workbuddy2api/config.json
              subPath: config.json
            # 面板会提示「上游配置里声明的账号目录与本站读取的不一致」—— 属**预期**现象：
            # 面板把 config.json 里的 auth_dir（官方默认就是相对路径 "./auths"）与自己的
            # WB_AUTH_DIR（默认绝对路径 /opt/workbuddy2api/auths）做**字面**比较
            # （server/services/wb2api.py 的 load_upstream_config），字面不同就提示。
            # 两者其实是同一块卷：上游 CWD 是 /app ⇒ "./auths" 就是 /app/auths（上面那块
            # auths 卷）；面板读的 /opt/workbuddy2api/auths 也是它。官方 Docker 部署同样会
            # 显示这句（它也不覆盖 WB_AUTH_DIR）—— 面板的实际行为是对的：以 AUTH_DIR 为准。
            # 与上游**共享**的账号目录：面板「扫码添加账号」写在这里，上游每 5 秒扫一次
            # 自动进池（不用重启）。这里是真目录，不是旧版本里那个「只读空卷」。
            - name: auths
              mountPath: /opt/workbuddy2api/auths
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: workbuddy2api-config
        - name: auths
          persistentVolumeClaim:
            claimName: workbuddy2api-auths
        - name: pool
          persistentVolumeClaim:
            claimName: workbuddy2api-pool
        - name: manager-data
          persistentVolumeClaim:
            claimName: workbuddy-manager-data

---
# 面板：整套部署的对外入口（下面的 Ingress 指向它）。
apiVersion: v1
kind: Service
metadata:
  name: workbuddy-manager
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy
    app.kubernetes.io/part-of: workbuddy
spec:
  type: ClusterIP
  # 两个 Service 选的是同一个 Pod（同 Pod 里有两个容器），靠端口名区分。
  selector:
    app.kubernetes.io/name: workbuddy
  ports:
    - name: web
      port: 7864
      targetPort: web

---
# 上游：**面板并不用它**（同 Pod 走 127.0.0.1）。留着只是为了集群内其他客户端或调试
# （`curl http://workbuddy2api:7863/healthz`）；不需要可以整段删掉。
apiVersion: v1
kind: Service
metadata:
  name: workbuddy2api
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy
    app.kubernetes.io/part-of: workbuddy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workbuddy
  ports:
    - name: api
      port: 7863
      targetPort: api

---
# ── 对外入口（可选，但公网使用必配 TLS）────────────────────────────
# 面板会流式返回（SSE）：反代必须关缓冲、放宽超时，否则「流式」会被中间层
# 攒成一整块，等于把流式白做了。
#
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: workbuddy-manager
#   namespace: workbuddy
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-buffering: "off"
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
#     # 面板的网关请求体上限是 8 MiB（WB_GATEWAY_MAX_BODY_MB），这里给足。
#     nginx.ingress.kubernetes.io/proxy-body-size: "16m"
# spec:
#   ingressClassName: nginx
#   tls:
#     - hosts: ["wb.example.com"]
#       secretName: workbuddy-tls
#   rules:
#     - host: wb.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: workbuddy-manager
#                 port:
#                   number: 7864
