# 上游 workbuddy2api（OpenAI 兼容网关）—— 账号池本体。
# 镜像来自本仓库的自动构建：ghcr.io/smagicalk/workbuddy2api:latest
#
# 部署顺序：00-namespace → 建 Secret → 本文件 → 20-manager
#   kubectl apply -f deploy/k8s/
#
# ── 与面板分开部署 ────────────────────────────────────────────────
# 本文件与 20-manager.yaml 是**两套独立的部署**：面板不挂这里的任何卷，
# 只通过 Service 走 HTTP（http://workbuddy2api:7863）连过来。因此：
#   · 两套可以各自调度、各自升级、各自重启，互不等待
#     （面板没有 podAffinity，上游没起来它也能正常 Running，界面会显示「上游不可用」）
#   · 代价：面板的「扫码添加账号」与「设置页保存」不可用 —— 那两项要靠直接
#     读写这里的 auths/ 与 config.json（上游没有对应的 HTTP 接口）。
#     替代做法写在 deploy/k8s/README.md；有 RWX 存储的话也能切回共享卷模式。
#
# ── 存储对应表（两个卷，全部由上游独享）──────────────────────────
#   PV workbuddy2api-auths    hostPath /srv/workbuddy/upstream/auths   1Gi
#      → 挂上游 /app/auths
#      里面放：auths/workbuddy-<uid>.json（每个账号一份凭证）
#      丢了会怎样：**要重新扫码加号**。这是最该备份的一个。
#   PV workbuddy2api-pool     hostPath /srv/workbuddy/upstream/pool    1Gi
#      → 挂上游 /app/data
#      里面放：state.json（积分 / 冷却 / 熔断计数）、model.json（成本账本）
#      丢了会怎样：不致命，但冷却状态与便宜号账本要重新学。
#
# 配置（config.json）**不在卷上** —— 它是下面那个 ConfigMap，只读挂载；
# 密钥由 Secret 经 WB2A_API_KEY 注入。改配置见文件开头第 3 条。
#
# hostPath 最省事、最透明，代价是**数据绑在节点上**（Pod 只能调度到有数据的那台）。
# 多节点集群换成 NFS / 云盘 CSI —— 那是动态供给，把本文件的 PV 全删掉、
# 给 PVC 填上 storageClassName 即可（写法见 deploy/k8s/README.md）。
# reclaimPolicy 一律 Retain：删 PVC **不会**删数据，要清干净得自己上节点删目录。
#
# ── 三个必须知道的点 ──────────────────────────────────────────────
#   1. replicas 固定 1，别直接扩。账号池是「单进程本地状态 + 本地 auths 目录」：
#      多副本会各自把定时任务跑一遍（重复签到/领奖，还有 WAF 风险），
#      并争抢同一份 state.json。真要扩容，先关掉 config.json 里的 schedule.* 开关。
#   2. 探针刻意用 TCP，不用 /healthz：/healthz 在账号池为空时返回 503（应用层语义，
#      见上游 handler.go 的 Pool.ServableNow()）。当 liveness 会让 Pod 反复重启，
#      当 readiness 会让「还没加账号」时 Service 不转发、连登录加号都做不了。
#   3. 配置来自 **ConfigMap**（只读挂载），上游**只在启动时读一次**、没有热重载：
#      改配置走 `kubectl -n workbuddy edit configmap workbuddy2api-config`，
#      然后 `kubectl -n workbuddy rollout restart deploy/workbuddy2api`。
#      换密钥更简单：改 Secret 后重启（文件里的 api_key 恒为空，由环境变量注入）。

---
# 账号凭证卷：**最该备份的一个**。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-auths
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/auths
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-auths

---
# 账号池状态卷：丢了不致命，重建即可。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-pool
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/pool
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-pool

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-auths
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-pool
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
# ⚠️ 这个 Secret **故意不放在清单里** —— 请先手动建它，再 apply 本文件。
#    两个用途都要它：
#      · 上游的 WB2A_API_KEY 环境变量（ConfigMap 里的 api_key 恒为空）
#      · 面板读它当 WB2API_KEY（面板与上游之间的鉴权）
#    缺了它两边的 Pod 都起不来（会明确报错，不会静默降级）。
#
#   kubectl -n workbuddy create secret generic workbuddy2api-secret \
#     --from-literal=api_key="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 为什么不做成清单里的一段：那样每次 `kubectl apply -f deploy/k8s/` 都会用文件里的
# 占位值把你刚设的真密钥覆盖回去。密钥的真源只应该有一处。
#
# 想坚持用 YAML 管密钥，把下面这段取消注释，并保证它排在 Deployment 之前：
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: workbuddy2api-secret
#   namespace: workbuddy
# type: Opaque
# stringData:
#   api_key: "换成你自己的随机值（openssl rand -hex 32）"

---
# 上游的配置本体：**只读**挂成 /app/config.json。
#   · api_key 故意留空 —— 真值由 Deployment 里的 WB2A_API_KEY（来自 Secret）注入，
#     所以这个 ConfigMap 里没有任何密钥，可以安全地进版本库。
#   · 改配置 = 改这里 + 重启上游（上游只在启动时读一次，没有热重载）：
#       kubectl -n workbuddy edit configmap workbuddy2api-config
#       kubectl -n workbuddy rollout restart deploy/workbuddy2api
#   · 挂载走 subPath（单文件），ConfigMap 更新**不会**自动进容器 —— 反正都要重启。
# 缺的字段会走上游内置默认值（含那套默认定时任务）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbuddy2api-config
  namespace: workbuddy
data:
  config.json: |
    {
      "listen": ":7863",
      "api_key": "",
      "auth_dir": "./auths",
      "state_file": "./data/state.json",
      "cooldown": {
        "soft_rate": "600s",
        "soft_rate_max": "2h"
      },
      "schedule": {
        "checkin_hours": [9, 21],
        "travel_hours": [9, 21],
        "activity_hours": [10],
        "keepalive_hours": [22],
        "school_hours": [12],
        "cat_hours": [1],
        "checkin_enabled": true,
        "travel_enabled": true,
        "activity_enabled": true,
        "keepalive_enabled": true,
        "school_enabled": true,
        "cat_enabled": true
      },
      "admin": {
        "enabled": false
      },
      "global": {
        "enabled": true,
        "chat_base": "",
        "billing_base": ""
      },
      "upstream": {
        "timeout_seconds": 120,
        "header_timeout_seconds": 120,
        "idle_timeout_seconds": 300,
        "user_agent": "",
        "client_version": "",
        "cli_version": "",
        "device_token": "",
        "device_token_file": "",
        "client_name": "WorkBuddy",
        "passthrough_ip": false
      },
      "features": {
        "sanitize_blacklist_fingerprints": true
      },
      "prompt": {
        "mode": "passthrough",
        "file": ""
      },
      "upstash": {
        "url": "",
        "token": ""
      },
      "pool": {
        "max_in_flight": 3,
        "max_in_flight_global": 2,
        "breaker_threshold": 3,
        "breaker_cooldown": "30m",
        "breaker_cooldown_max": "6h",
        "degrade_threshold": 5,
        "degrade_cooldown": "10m",
        "degrade_cooldown_max": "2h",
        "idle_weight_per_hour": 0.5,
        "idle_weight_max": 5.0,
        "expiring_soon": "168h",
        "cost_explore_interval": "30m"
      },
      "session_sticky": {
        "enabled": true,
        "ttl": "30m",
        "gc_interval": "5m"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbuddy2api
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy2api
    app.kubernetes.io/part-of: workbuddy
spec:
  # 见文件开头第 1 条：账号池是单实例的本地状态，别扩。
  replicas: 1
  strategy:
    # 不用 RollingUpdate：滚动时新旧 Pod 会同时持有同一份 state.json。
    # 宁可停一下再起。
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workbuddy2api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbuddy2api
        app.kubernetes.io/part-of: workbuddy
    spec:
      # 镜像本身就是 uid 10001(app)；fsGroup 让 PV 目录直接可写 ——
      # 等价于 Docker 部署里的 chown -R 10001:10001 auths data。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: workbuddy2api
          image: ghcr.io/smagicalk/workbuddy2api:latest
          # 上游换附件后本仓库会重建镜像，标签仍是 latest：必须每次拉取，
          # 否则节点上会一直复用旧镜像。
          imagePullPolicy: Always
          # 要可复现（不被下一次上游重建影响）就钉内容寻址标签：
          #   image: ghcr.io/smagicalk/workbuddy2api:sha256-6d3582fcedbb
          env:
            # 定时任务里「几点执行」按进程本地时区判定（上游 nowFunc = time.Now），
            # 固定 CST 让 config.json 里的 9 / 21 点就是北京时间。
            - name: TZ
              value: Asia/Shanghai
            # 密钥：ConfigMap 里的 api_key 故意留空，由这个环境变量注入。
            # 上游支持 WB2A_* 覆盖配置，且覆盖发生在校验之前（cmd/server/config.go），
            # 所以文件里留空也没问题 —— 密钥只存在于 Secret 一处。
            - name: WB2A_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workbuddy2api-secret
                  key: api_key
          ports:
            - name: http
              containerPort: 7863
          # 启动可能因为账号多而稍慢，用 startupProbe 挡住 liveness，免得启动期被误判重启。
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # 流式转发是 IO 密集，CPU 上限过紧会拖慢首字延迟，按机器调整。
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 配置：ConfigMap 只读挂成单文件。上游从不写它，只读正合适；
            # 改配置 = 改 ConfigMap + 重启上游（见文件开头第 3 条）。
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            # 账号凭证：扫码落盘、令牌刷新都是 tmp+rename 回写，必须可写。
            - name: auths
              mountPath: /app/auths
            - name: pool
              mountPath: /app/data
      volumes:
        - name: config
          configMap:
            name: workbuddy2api-config
        - name: auths
          persistentVolumeClaim:
            claimName: workbuddy2api-auths
        - name: pool
          persistentVolumeClaim:
            claimName: workbuddy2api-pool

---
# 只集群内可达。下游客户端应该连**面板**的 /v1（密钥、配额、日志都在面板侧），
# 而不是直连这里；上游只跟面板对话，因此不需要对外发布。
apiVersion: v1
kind: Service
metadata:
  name: workbuddy2api
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy2api
    app.kubernetes.io/part-of: workbuddy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workbuddy2api
  ports:
    - name: http
      port: 7863
      targetPort: http
