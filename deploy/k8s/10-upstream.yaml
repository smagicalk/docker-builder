# 上游 workbuddy2api（OpenAI 兼容网关）—— 账号池本体。
# 镜像来自本仓库的自动构建：ghcr.io/smagicalk/workbuddy2api:latest
#
# 部署顺序：00-namespace → 建 Secret → 本文件 → 20-manager
#   kubectl apply -f deploy/k8s/
#
# ── 与面板分开部署 ────────────────────────────────────────────────
# 本文件与 20-manager.yaml 是**两套独立的部署**：面板不挂这里的任何卷，
# 只通过 Service 走 HTTP（http://workbuddy2api:7863）连过来。因此：
#   · 两套可以各自调度、各自升级、各自重启，互不等待
#     （面板没有 podAffinity，上游没起来它也能正常 Running，界面会显示「上游不可用」）
#   · 代价：面板的「扫码添加账号」与「设置页保存」不可用 —— 那两项要靠直接
#     读写这里的 auths/ 与 config.json（上游没有对应的 HTTP 接口）。
#     替代做法写在 deploy/k8s/README.md；有 RWX 存储的话也能切回共享卷模式。
#
# ── 存储对应表（三个卷，全部由上游独享）──────────────────────────
#   PV workbuddy2api-config   hostPath /srv/workbuddy/upstream/config  1Gi
#      → 挂上游 /app/config.json（subPath 单文件）
#      里面放：config.json（定时任务 / 限流 / 并发 / 提示词等全部配置）
#      丢了会怎样：回落到 ConfigMap 模板（api_key 由 init 容器重新填入），
#                  面板改过的设置会丢 —— 所以值得备份。
#   PV workbuddy2api-auths    hostPath /srv/workbuddy/upstream/auths   1Gi
#      → 挂上游 /app/auths
#      里面放：auths/workbuddy-<uid>.json（每个账号一份凭证）
#      丢了会怎样：**要重新扫码加号**。这是三个卷里最该备份的。
#   PV workbuddy2api-pool     hostPath /srv/workbuddy/upstream/pool    1Gi
#      → 挂上游 /app/data
#      里面放：state.json（积分 / 冷却 / 熔断计数）、model.json（成本账本）
#      丢了会怎样：不致命，但冷却状态与便宜号账本要重新学。
#
# hostPath 最省事、最透明，代价是**数据绑在节点上**（Pod 只能调度到有数据的那台）。
# 多节点集群换成 NFS / 云盘 CSI —— 那是动态供给，把本文件的 PV 全删掉、
# 给 PVC 填上 storageClassName 即可（写法见 deploy/k8s/README.md）。
# reclaimPolicy 一律 Retain：删 PVC **不会**删数据，要清干净得自己上节点删目录。
#
# ── 三个必须知道的点 ──────────────────────────────────────────────
#   1. replicas 固定 1，别直接扩。账号池是「单进程本地状态 + 本地 auths 目录」：
#      多副本会各自把定时任务跑一遍（重复签到/领奖，还有 WAF 风险），
#      并争抢同一份 state.json。真要扩容，先关掉 config.json 里的 schedule.* 开关。
#   2. 探针刻意用 TCP，不用 /healthz：/healthz 在账号池为空时返回 503（应用层语义，
#      见上游 handler.go 的 Pool.ServableNow()）。当 liveness 会让 Pod 反复重启，
#      当 readiness 会让「还没加账号」时 Service 不转发、连登录加号都做不了。
#   3. 上游**只在启动时读 config.json**，没有热重载。改完配置要
#      `kubectl -n workbuddy rollout restart deploy/workbuddy2api`。

---
# 配置卷：只装 config.json（subPath 挂成单文件）。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-config
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  # 空字符串 = 静态供给（不走 StorageClass 动态创建）。必须与 PVC 一致。
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/config
    type: DirectoryOrCreate
  # 钉住目标 PVC：静态供给时若不加 claimRef，别的 PVC 可能先把这块 PV 抢走。
  # 换命名空间时这里要跟着改（或删掉这三行）。
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-config
  # ── 多节点集群：把 hostPath 换成下面任一种 ──────────────────────
  # (a) 本地盘 + 节点亲和（数据仍绑节点，但调度不会跑到没有盘的那台）
  #     local:
  #       path: /srv/workbuddy/upstream/config
  #     nodeAffinity:
  #       required:
  #         nodeSelectorTerms:
  #           - matchExpressions:
  #               - key: kubernetes.io/hostname
  #                 operator: In
  #                 values: ["node-1"]
  # (b) NFS（三个卷都可以这样换）
  #     nfs:
  #       server: 10.0.0.10
  #       path: /export/workbuddy/upstream/config

---
# 账号凭证卷：**最该备份的一个**。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-auths
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/auths
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-auths

---
# 账号池状态卷：丢了不致命，重建即可。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbuddy2api-pool
  labels:
    app.kubernetes.io/part-of: workbuddy
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  hostPath:
    path: /srv/workbuddy/upstream/pool
    type: DirectoryOrCreate
  claimRef:
    namespace: workbuddy
    name: workbuddy2api-pool

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-config
  namespace: workbuddy
spec:
  # 与 PV 一致，都为空 = 静态供给
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-auths
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbuddy2api-pool
  namespace: workbuddy
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
# ⚠️ 这个 Secret **故意不放在清单里** —— 请先手动建它，再 apply 本文件。
#    两个用途都要它：
#      · 上游的 init 容器读它，把 api_key 写进 config.json（login.sh 等脚本要读文件）
#      · 面板读它当 WB2API_KEY（面板与上游之间的鉴权）
#    缺了它两边的 Pod 都起不来（会明确报错，不会静默降级）。
#
#   kubectl -n workbuddy create secret generic workbuddy2api-secret \
#     --from-literal=api_key="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 为什么不做成清单里的一段：那样每次 `kubectl apply -f deploy/k8s/` 都会用文件里的
# 占位值把你刚设的真密钥覆盖回去。密钥的真源只应该有一处。
#
# 想坚持用 YAML 管密钥，把下面这段取消注释，并保证它排在 Deployment 之前：
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: workbuddy2api-secret
#   namespace: workbuddy
# type: Opaque
# stringData:
#   api_key: "换成你自己的随机值（openssl rand -hex 32）"

---
# config.json 的初始模板：只在配置卷上还没有 config.json 时用一次。
# api_key 留空，由 init 容器从上面的 Secret 填入。
# 这里给的是上游默认基线；缺的字段会走上游内置默认值（含那套默认定时任务）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbuddy2api-config-template
  namespace: workbuddy
data:
  config.json: |
    {
      "listen": ":7863",
      "api_key": "",
      "auth_dir": "./auths",
      "state_file": "./data/state.json",
      "cooldown": {
        "soft_rate": "600s",
        "soft_rate_max": "2h"
      },
      "schedule": {
        "checkin_hours": [9, 21],
        "travel_hours": [9, 21],
        "activity_hours": [10],
        "keepalive_hours": [22],
        "school_hours": [12],
        "cat_hours": [1],
        "checkin_enabled": true,
        "travel_enabled": true,
        "activity_enabled": true,
        "keepalive_enabled": true,
        "school_enabled": true,
        "cat_enabled": true
      },
      "admin": {
        "enabled": false
      },
      "global": {
        "enabled": true,
        "chat_base": "",
        "billing_base": ""
      },
      "upstream": {
        "timeout_seconds": 120,
        "header_timeout_seconds": 120,
        "idle_timeout_seconds": 300,
        "user_agent": "",
        "client_version": "",
        "cli_version": "",
        "device_token": "",
        "device_token_file": "",
        "client_name": "WorkBuddy",
        "passthrough_ip": false
      },
      "features": {
        "sanitize_blacklist_fingerprints": true
      },
      "prompt": {
        "mode": "passthrough",
        "file": ""
      },
      "upstash": {
        "url": "",
        "token": ""
      },
      "pool": {
        "max_in_flight": 3,
        "max_in_flight_global": 2,
        "breaker_threshold": 3,
        "breaker_cooldown": "30m",
        "breaker_cooldown_max": "6h",
        "degrade_threshold": 5,
        "degrade_cooldown": "10m",
        "degrade_cooldown_max": "2h",
        "idle_weight_per_hour": 0.5,
        "idle_weight_max": 5.0,
        "expiring_soon": "168h",
        "cost_explore_interval": "30m"
      },
      "session_sticky": {
        "enabled": true,
        "ttl": "30m",
        "gc_interval": "5m"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbuddy2api
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy2api
    app.kubernetes.io/part-of: workbuddy
spec:
  # 见文件开头第 1 条：账号池是单实例的本地状态，别扩。
  replicas: 1
  strategy:
    # 不用 RollingUpdate：滚动时新旧 Pod 会同时持有同一份 state.json。
    # 宁可停一下再起。
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workbuddy2api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workbuddy2api
        app.kubernetes.io/part-of: workbuddy
    spec:
      # 镜像本身就是 uid 10001(app)；fsGroup 让 PV 目录直接可写 ——
      # 等价于 Docker 部署里的 chown -R 10001:10001 auths data。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: prepare-config
          image: ghcr.io/smagicalk/workbuddy2api:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # 首次启动：用 ConfigMap 模板生成 config.json。
              # 主容器是拿 subPath 把**这一个文件**挂到 /app/config.json 的，
              # 文件不存在会直接挂载失败，所以必须由这里先把它造出来。
              if [ ! -f /cfg/config.json ]; then
                echo "[init] 配置卷上还没有 config.json，从模板生成"
                cp /template/config.json /cfg/config.json
              fi
              # 把 api_key 同步成 Secret 里的值。只在这一处写文件，避免
              # 「Secret 与文件各说一套」；上游的 login.sh 等脚本都读这个文件。
              python3 -c "import json,os;p='/cfg/config.json';c=json.load(open(p));c['api_key']=os.environ['API_KEY'];json.dump(c,open(p,'w'),ensure_ascii=False,indent=2);print('[init] api_key 已同步自 Secret')"
              echo "[init] 配置卷就绪"
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: workbuddy2api-secret
                  key: api_key
          volumeMounts:
            - name: config
              mountPath: /cfg
            - name: template
              mountPath: /template
              readOnly: true
      containers:
        - name: workbuddy2api
          image: ghcr.io/smagicalk/workbuddy2api:latest
          # 上游换附件后本仓库会重建镜像，标签仍是 latest：必须每次拉取，
          # 否则节点上会一直复用旧镜像。
          imagePullPolicy: Always
          # 要可复现（不被下一次上游重建影响）就钉内容寻址标签：
          #   image: ghcr.io/smagicalk/workbuddy2api:sha256-6d3582fcedbb
          env:
            # 定时任务里「几点执行」按进程本地时区判定（上游 nowFunc = time.Now），
            # 固定 CST 让 config.json 里的 9 / 21 点就是北京时间。
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 7863
          # 启动可能因为账号多而稍慢，用 startupProbe 挡住 liveness，免得启动期被误判重启。
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # 流式转发是 IO 密集，CPU 上限过紧会拖慢首字延迟，按机器调整。
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 配置：挂成单文件。上游自己不写它，但**故意不给 readOnly** ——
            # 拆开部署后没有共享卷，改配置要靠 kubectl cp / exec 直接写这个文件，
            # 而 subPath 单文件挂载本身是可写的（写进去就落到配置卷上）。
            - name: config
              mountPath: /app/config.json
              subPath: config.json
            # 账号凭证：扫码落盘、令牌刷新都是 tmp+rename 回写，必须可写。
            - name: auths
              mountPath: /app/auths
            - name: pool
              mountPath: /app/data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: workbuddy2api-config
        - name: auths
          persistentVolumeClaim:
            claimName: workbuddy2api-auths
        - name: pool
          persistentVolumeClaim:
            claimName: workbuddy2api-pool
        - name: template
          configMap:
            name: workbuddy2api-config-template

---
# 只集群内可达。下游客户端应该连**面板**的 /v1（密钥、配额、日志都在面板侧），
# 而不是直连这里；上游只跟面板对话，因此不需要对外发布。
apiVersion: v1
kind: Service
metadata:
  name: workbuddy2api
  namespace: workbuddy
  labels:
    app.kubernetes.io/name: workbuddy2api
    app.kubernetes.io/part-of: workbuddy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workbuddy2api
  ports:
    - name: http
      port: 7863
      targetPort: http
